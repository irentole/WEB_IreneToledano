  <script>
    const projectButtons = [...document.querySelectorAll('.project-menu button')];
    const homeName = document.querySelector('.home-name');
    const previews = [...document.querySelectorAll('.project-preview')];
    const primaryPreview = document.querySelector('.project-preview--top');
    const primaryPreviewSurface = primaryPreview.querySelector('.project-preview__surface');
    const projectPreviewImages = {
      'SubTexture': 'Content/SubTexture/web/POSTER.jpg',
      '¡Vámonos de compras!': 'Content/vamonos-de-compras/web/POSTER.jpg',
      'Australian Artistic Swimming Championship 2023': 'Content/Australian Artistic Swimming Championship 2023/POSTER.jpg',
      'Basel Aquatics': 'Content/Basel Aquatics/LOGO 1.png',
      'D PATA NEGRA': 'Content/D Pata Negra/POSTER D Pata.png',      'Mundo fluctuante': 'Content/MUNDO FLUCTUANTE/web/POSTER FLUCTUATING.jpg',
      'FOOD JEWELS': 'Content/FOOD JEWELS/web/POSTER.jpg',
      'Ortiz': 'Content/Ortiz/POSTER ORTIZ.jpg',
      'McRib': 'Content/McRib/poster McRib.jpg',
      'girls talk': 'Content/girls talk/POSTER.png',
      'Thoughts and Emotions': 'Content/toughts and emotions/POSTER.png'
    };
    const projectPosterColors = {
      'SubTexture': '#167f9b',
      '¡Vámonos de compras!': '#72d2ee',
      'Australian Artistic Swimming Championship 2023': '#069b89',
      'Basel Aquatics': '#171717',
      'D PATA NEGRA': '#c9342f',
      'MHT chairs': '#303537',
      'Mundo fluctuante': '#7958a7',
      'FOOD JEWELS': '#9b7955',
      'Ortiz': '#d08a42',
      'McRib': '#d84a28',
      'girls talk': '#e88cae',
      'Thoughts and Emotions': '#5968ae'
    };

    function showProjectPreview(button) {
      const image = projectPreviewImages[button.dataset.project];
      primaryPreview.classList.toggle('has-project-image', Boolean(image));
      primaryPreviewSurface.style.backgroundImage = image ? `url("${image}")` : '';
    }

    function clearProjectPreview() {
      primaryPreview.classList.remove('has-project-image');
      primaryPreviewSurface.style.backgroundImage = '';
    }

    const rotatingProjects = projectButtons.filter(button => projectPreviewImages[button.dataset.project]);
    let rotatingProjectIndex = 0;
    let hoveredProject = null;
    let focusedProject = null;
    let previewRotationTimer;
    let smoothMobileScroll = window.scrollY;
    let mobileGalleryOffset = 0;
    let desktopGalleryOffset = 0;
    let pinnedMobileProject = null;
    let pinnedMobileOffset = null;
    let pinnedDesktopProject = null;
    let pinnedDesktopOffset = null;
    let previousGalleryTime = null;
    const mobileLayout = window.matchMedia('(max-width: 800px)');
    const mobileCanHover = window.matchMedia('(max-width: 800px) and (hover: hover) and (pointer: fine)');

    [false, true].forEach(isDuplicate => {
      rotatingProjects.forEach(button => {
        const image = document.createElement('img');
        image.className = 'mobile-gallery__image';
        image.dataset.project = button.dataset.project;
        image.dataset.dominantColor = projectPosterColors[button.dataset.project] || '#b8b8b8';
        if (button.dataset.href) image.dataset.href = button.dataset.href;
        image.src = projectPreviewImages[button.dataset.project];
        image.alt = isDuplicate ? '' : `Poster de ${button.dataset.project}`;
        if (isDuplicate) {
          image.setAttribute('aria-hidden', 'true');
        } else if (button.dataset.href) {
          image.setAttribute('role', 'link');
          image.tabIndex = 0;
        }
        primaryPreviewSurface.appendChild(image);
      });
    });
    const mobileGalleryImages = [...primaryPreviewSurface.querySelectorAll('.mobile-gallery__image')];

    function releasePinnedGalleryProject() {
      pinnedMobileProject = null;
      pinnedMobileOffset = null;
      pinnedDesktopProject = null;
      pinnedDesktopOffset = null;
      clearActiveGalleryProject();
    }

    primaryPreview.addEventListener('wheel', event => {
      const loopHeight = primaryPreviewSurface.scrollHeight / 2;
      if (loopHeight <= 0) return;

      event.preventDefault();
      releasePinnedGalleryProject();

      const lineHeight = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
      const unit = event.deltaMode === WheelEvent.DOM_DELTA_LINE
        ? lineHeight
        : event.deltaMode === WheelEvent.DOM_DELTA_PAGE
          ? primaryPreview.clientHeight
          : 1;
      const gestureDelta = (Math.abs(event.deltaY) >= Math.abs(event.deltaX) ? event.deltaY : event.deltaX) * unit;

      if (mobileLayout.matches) {
        mobileGalleryOffset = (mobileGalleryOffset + gestureDelta + loopHeight) % loopHeight;
      } else {
        desktopGalleryOffset = (desktopGalleryOffset + gestureDelta + loopHeight) % loopHeight;
      }
    }, { passive: false });

    function extractPosterColor(image) {
      try {
        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d', { willReadFrequently: true });
        canvas.width = 24;
        canvas.height = 24;
        context.drawImage(image, 0, 0, 24, 24);
        const pixels = context.getImageData(0, 0, 24, 24).data;
        const colors = new Map();
        const neutralColors = new Map();
        for (let index = 0; index < pixels.length; index += 4) {
          if (pixels[index + 3] < 128) continue;
          const sourceRed = pixels[index];
          const sourceGreen = pixels[index + 1];
          const sourceBlue = pixels[index + 2];
          const maximum = Math.max(sourceRed, sourceGreen, sourceBlue);
          const minimum = Math.min(sourceRed, sourceGreen, sourceBlue);
          const saturation = maximum === 0 ? 0 : (maximum - minimum) / maximum;
          const brightness = (sourceRed + sourceGreen + sourceBlue) / 3;
          const red = Math.round(sourceRed / 24) * 24;
          const green = Math.round(sourceGreen / 24) * 24;
          const blue = Math.round(sourceBlue / 24) * 24;
          const key = `${Math.min(red, 255)},${Math.min(green, 255)},${Math.min(blue, 255)}`;
          neutralColors.set(key, (neutralColors.get(key) || 0) + 1);
          if (saturation > .16 && brightness > 28 && brightness < 238) {
            colors.set(key, (colors.get(key) || 0) + 1 + saturation * 2.5);
          }
        }
        const palette = colors.size ? colors : neutralColors;
        const dominant = [...palette].sort((a, b) => b[1] - a[1])[0];
        if (dominant) {
          const channels = dominant[0].split(',').map(Number);
          const lifted = channels.map(channel => Math.round(channel + (255 - channel) * .12));
          image.dataset.dominantColor = `rgb(${lifted.join(',')})`;
        }
      } catch (error) {
        image.dataset.dominantColor = '#ffffff';
      }
    }

    mobileGalleryImages.forEach(image => {
      if (image.dataset.dominantColor) return;
      if (image.complete) extractPosterColor(image);
      else image.addEventListener('load', () => extractPosterColor(image), { once: true });
    });

    function updateGalleryEdgeColors() {
      const galleryRect = primaryPreview.getBoundingClientRect();
      const topPoint = galleryRect.top + 2;
      const bottomPoint = galleryRect.bottom - 2;
      const topImage = mobileGalleryImages.find(image => {
        const rect = image.getBoundingClientRect();
        return rect.top <= topPoint && rect.bottom >= topPoint;
      });
      const bottomImage = mobileGalleryImages.find(image => {
        const rect = image.getBoundingClientRect();
        return rect.top <= bottomPoint && rect.bottom >= bottomPoint;
      });
      if (topImage?.dataset.dominantColor) {
        primaryPreview.style.setProperty('--gallery-top-color', topImage.dataset.dominantColor);
      }
      if (bottomImage?.dataset.dominantColor) {
        primaryPreview.style.setProperty('--gallery-bottom-color', bottomImage.dataset.dominantColor);
      }
    }

    function updateGalleryPosterEffects() {
      const galleryRect = primaryPreview.getBoundingClientRect();
      const galleryCenter = galleryRect.top + galleryRect.height / 2;
      const fadeDistance = Math.max(galleryRect.height * .58, 1);
      let centerImage = null;
      let centerDistance = Infinity;

      mobileGalleryImages.forEach(image => {
        const rect = image.getBoundingClientRect();
        const imageCenter = rect.top + rect.height / 2;
        const distance = Math.abs(imageCenter - galleryCenter);
        const visibility = Math.pow(Math.max(0, Math.min(1, 1 - distance / fadeDistance)), 1.65) * .8;
        image.style.setProperty('--poster-opacity', visibility.toFixed(3));

        if (rect.bottom >= galleryRect.top && rect.top <= galleryRect.bottom && distance < centerDistance) {
          centerDistance = distance;
          centerImage = image;
        }
      });

      mobileGalleryImages.forEach(image => {
        image.classList.toggle('is-gallery-center', image === centerImage);
      });
    }

    function openProject(href) {
      window.location.href = href;
    }

    function openGalleryProject(image) {
      if (image.dataset.href) openProject(image.dataset.href);
    }

    function setActiveGalleryProject(project) {
      primaryPreview.classList.add('has-active-project');
      mobileGalleryImages.forEach(image => {
        image.classList.toggle('is-active-project', image.dataset.project === project);
      });
    }

    function clearActiveGalleryProject() {
      primaryPreview.classList.remove('has-active-project');
      mobileGalleryImages.forEach(image => image.classList.remove('is-active-project'));
    }

    mobileGalleryImages.forEach(image => {
      const projectButton = projectButtons.find(button => button.dataset.project === image.dataset.project);
      image.addEventListener('pointerenter', () => {
        if (mobileCanHover.matches && projectButton) pinMobilePoster(projectButton);
        if (!mobileLayout.matches && projectButton) pinDesktopPoster(projectButton);
      });
      image.addEventListener('pointerleave', () => {
        if (mobileCanHover.matches && pinnedMobileProject === projectButton) {
          pinnedMobileProject = null;
          pinnedMobileOffset = null;
          clearActiveGalleryProject();
        }
        if (!mobileLayout.matches && pinnedDesktopProject === projectButton) {
          pinnedDesktopProject = null;
          pinnedDesktopOffset = null;
          clearActiveGalleryProject();
        }
      });
      image.addEventListener('click', () => openGalleryProject(image));
      image.addEventListener('keydown', event => {
        if (event.key === 'Enter') openGalleryProject(image);
      });
    });
    function showNextProjectPreview() {
      if (!rotatingProjects.length || hoveredProject || focusedProject) return;
      showProjectPreview(rotatingProjects[rotatingProjectIndex]);
      rotatingProjectIndex = (rotatingProjectIndex + 1) % rotatingProjects.length;
    }

    function startPreviewRotation() {
      clearInterval(previewRotationTimer);
      if (hoveredProject || focusedProject) return;
      primaryPreview.classList.remove('is-interactive');
      showNextProjectPreview();
      if (mobileLayout.matches) return;
      previewRotationTimer = setInterval(showNextProjectPreview, 800);
    }

    function animateMobileGallery(time) {
      const frameDuration = previousGalleryTime === null ? 0 : Math.min(40, time - previousGalleryTime);
      previousGalleryTime = time;
      if (mobileLayout.matches) {
        const loopHeight = primaryPreviewSurface.scrollHeight / 2;
        if (loopHeight > 0) {
          const previousSmoothScroll = smoothMobileScroll;
          smoothMobileScroll += (window.scrollY - smoothMobileScroll) * .075;
          if (pinnedMobileOffset !== null) {
            let distance = (pinnedMobileOffset - mobileGalleryOffset) % loopHeight;
            if (distance > loopHeight / 2) distance -= loopHeight;
            if (distance < -loopHeight / 2) distance += loopHeight;
            mobileGalleryOffset = (mobileGalleryOffset + distance * .09 + loopHeight) % loopHeight;
          } else {
            mobileGalleryOffset = (mobileGalleryOffset + frameDuration * .024 + (smoothMobileScroll - previousSmoothScroll) * 1.35 + loopHeight) % loopHeight;
          }
          primaryPreviewSurface.style.transform = `translateY(${-mobileGalleryOffset}px)`;
          updateGalleryEdgeColors();
          updateGalleryPosterEffects();
        }
      } else {
        const loopHeight = primaryPreviewSurface.scrollHeight / 2;
        if (loopHeight > 0) {
          if (pinnedDesktopOffset !== null) {
            let distance = (pinnedDesktopOffset - desktopGalleryOffset) % loopHeight;
            if (distance > loopHeight / 2) distance -= loopHeight;
            if (distance < -loopHeight / 2) distance += loopHeight;
            desktopGalleryOffset = (desktopGalleryOffset + distance * .09 + loopHeight) % loopHeight;
          } else {
            desktopGalleryOffset = (desktopGalleryOffset + frameDuration * .024) % loopHeight;
          }
          primaryPreviewSurface.style.transform = `translateY(${-desktopGalleryOffset}px)`;
          updateGalleryEdgeColors();
          updateGalleryPosterEffects();
        }
      }
      requestAnimationFrame(animateMobileGallery);
    }

    function pinMobilePoster(button) {
      const image = mobileGalleryImages.find(item => item.dataset.project === button.dataset.project);
      if (!image) return false;
      const loopHeight = primaryPreviewSurface.scrollHeight / 2;
      if (loopHeight <= 0 || image.offsetHeight <= 0) return false;
      pinnedMobileProject = button;
      pinnedMobileOffset = ((image.offsetTop + image.offsetHeight / 2 - primaryPreview.clientHeight / 2) % loopHeight + loopHeight) % loopHeight;
      setActiveGalleryProject(button.dataset.project);
      return true;
    }

    function pinDesktopPoster(button) {
      const image = mobileGalleryImages.find(item => item.dataset.project === button.dataset.project);
      if (!image) return false;
      const loopHeight = primaryPreviewSurface.scrollHeight / 2;
      if (loopHeight <= 0 || image.offsetHeight <= 0) return false;
      pinnedDesktopProject = button;
      pinnedDesktopOffset = ((image.offsetTop + image.offsetHeight / 2 - primaryPreview.clientHeight / 2) % loopHeight + loopHeight) % loopHeight;
      setActiveGalleryProject(button.dataset.project);
      return true;
    }

    function showInteractivePreview() {
      clearInterval(previewRotationTimer);
      const activeProject = hoveredProject || focusedProject;
      primaryPreview.classList.toggle('is-interactive', Boolean(activeProject));
      if (activeProject) {
        showProjectPreview(activeProject);
      } else {
        startPreviewRotation();
      }
    }

    function selectProject(button) {
      projectButtons.forEach(item => {
        item.classList.toggle('is-selected', item === button);
        item.setAttribute('aria-pressed', item === button ? 'true' : 'false');
      });
      previews.forEach(preview => preview.dataset.project = button.dataset.project);
      if (mobileLayout.matches && projectPreviewImages[button.dataset.project]) {
        pinMobilePoster(button);
      }
      if (button.dataset.href) {
        if (usesPointer || reduceMotion) {
          openProject(button.dataset.href);
        } else {
          setTimeout(() => {
            openProject(button.dataset.href);
          }, 260);
        }
      }
    }

    projectButtons.forEach(button => {
      button.setAttribute('aria-pressed', 'false');
      button.addEventListener('click', () => selectProject(button));
      button.addEventListener('pointerenter', () => {
        hoveredProject = button;
        if (mobileCanHover.matches && projectPreviewImages[button.dataset.project]) {
          pinMobilePoster(button);
        }
        if (!mobileLayout.matches && projectPreviewImages[button.dataset.project]) {
          pinDesktopPoster(button);
        }
        showInteractivePreview();
      });
      button.addEventListener('focus', () => {
        focusedProject = button;
        showInteractivePreview();
      });
      button.addEventListener('pointerleave', () => {
        if (hoveredProject === button) hoveredProject = null;
        if (mobileCanHover.matches && pinnedMobileProject === button) {
          pinnedMobileProject = null;
          pinnedMobileOffset = null;
          clearActiveGalleryProject();
        }
        if (!mobileLayout.matches && pinnedDesktopProject === button) {
          pinnedDesktopProject = null;
          pinnedDesktopOffset = null;
          clearActiveGalleryProject();
        }
        showInteractivePreview();
      });
      button.addEventListener('blur', () => {
        if (focusedProject === button) focusedProject = null;
        showInteractivePreview();
      });
    });

    startPreviewRotation();

    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const usesPointer = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
    const projectMenu = document.querySelector('.project-menu');
    const menuItems = projectButtons.map(button => ({
      button,
      row: button.closest('li'),
      stretch: 1.2,
      width: 1,
      weight: 500,
      leading: 1.108
    }));

    let previousY = window.scrollY;
    let wind = 0;
    let windTarget = 0;
    let cursorY = null;
    let interactionPaused = false;
    let resumeTimer;
    let animationFrame;

    function renderIndexMotion() {
      const viewportHeight = window.innerHeight;
      const zoneBottom = viewportHeight * .3;
      const zoneDepth = viewportHeight * .24;

      wind += (windTarget - wind) * .18;
      windTarget *= .85;
      document.documentElement.style.setProperty('--wind', `${wind * 4}px`);
      document.documentElement.style.setProperty('--wind-skew', `${wind * -1}deg`);
      if (mobileLayout.matches) {
        document.documentElement.style.setProperty('--gallery-compress', `${Math.abs(wind) * 5}vw`);
      }

      menuItems.forEach(item => {
        if (interactionPaused) return;
        const top = item.row.getBoundingClientRect().top;
        const upperProgress = usesPointer
          ? cursorY === null ? 0 : Math.max(0, Math.min(1, (cursorY - top) / zoneDepth))
          : Math.max(0, Math.min(1, (zoneBottom - top) / zoneDepth));
        const targetStretch = 1.2 + upperProgress * (usesPointer ? .16 : .17);
        const targetWidth = 1 - upperProgress * (usesPointer ? .2 : .2);
        const targetWeight = 500 - upperProgress * (usesPointer ? 200 : 170);
        const targetLeading = 1.108 + upperProgress * (usesPointer ? .075 : .04);

        item.stretch += (targetStretch - item.stretch) * .18;
        item.width += (targetWidth - item.width) * .18;
        item.weight += (targetWeight - item.weight) * .18;
        item.leading += (targetLeading - item.leading) * .18;

        item.button.style.setProperty('--item-stretch', item.stretch.toFixed(4));
        item.button.style.setProperty('--item-width', item.width.toFixed(4));
        item.button.style.setProperty('--item-weight', Math.round(item.weight));
        item.row.style.setProperty('--item-leading', item.leading.toFixed(4));
      });

      animationFrame = requestAnimationFrame(renderIndexMotion);
    }

    if (!reduceMotion) {
      if (usesPointer) {
        projectMenu.addEventListener('pointerdown', () => {
          interactionPaused = true;
          wind = 0;
          windTarget = 0;
          document.documentElement.style.setProperty('--wind', '0px');
          document.documentElement.style.setProperty('--wind-skew', '0deg');
          clearTimeout(resumeTimer);
          resumeTimer = setTimeout(() => {
            interactionPaused = false;
          }, 260);
        });
        projectMenu.addEventListener('pointermove', event => {
          cursorY = event.clientY;
        }, { passive: true });
        projectMenu.addEventListener('pointerleave', () => {
          clearTimeout(resumeTimer);
          cursorY = null;
          interactionPaused = false;
        }, { passive: true });
      }

      window.addEventListener('scroll', () => {
        const delta = window.scrollY - previousY;
        previousY = window.scrollY;
        windTarget = Math.max(-1, Math.min(1, delta / 20));
        if (mobileLayout.matches) {
          if (delta < -1 && window.scrollY > 10) homeName.classList.add('is-hidden');
          if (delta > 1 || window.scrollY <= 2) homeName.classList.remove('is-hidden');
        }
        if (mobileLayout.matches && Math.abs(delta) > 1) {
          pinnedMobileProject = null;
          pinnedMobileOffset = null;
          clearActiveGalleryProject();
        }
      }, { passive: true });
      animationFrame = requestAnimationFrame(renderIndexMotion);
      requestAnimationFrame(animateMobileGallery);
    }
  </script>
