  <script>
    const projectButtons = [...document.querySelectorAll('.project-menu button')];
    const previews = [...document.querySelectorAll('.project-preview')];
    const primaryPreview = document.querySelector('.project-preview--top');
    const primaryPreviewSurface = primaryPreview.querySelector('.project-preview__surface');
    const projectPreviewImages = {
      'SubTexture': 'Content/SubTexture/POSTER.jpg',
      '¡Vámonos de compras!': 'Content/¡Vámonos de compras!/POSTER.png',
      'Australian Artistic Swimming Championship 2023': 'Content/Australian Artistic Swimming Championship 2023/POSTER.jpg',
      'Basel Aquatics': 'Content/Basel Aquatics/LOGO 1.png',
      'D PATA NEGRA': 'Content/D Pata Negra/POSTER D Pata.png',
      'MHT chairs': 'Content/MHT chairs/POSTER MHT.png',
      'Mundo fluctuante': 'Content/MUNDO FLUCTUANTE/POSTER FLUCTUATING.png',
      'Ortiz': 'Content/Ortiz/POSTER ORTIZ.jpg',
      'McRib': 'Content/McRib/poster McRib.jpg',
      'girls talk': 'Content/girls talk/POSTER.png',
      'Thoughts and Emotions': 'Content/toughts and emotions/POSTER.png'
    };

    function showProjectPreview(button) {
      const image = projectPreviewImages[button.dataset.project];
      primaryPreview.classList.toggle('has-project-image', Boolean(image));
      primaryPreviewSurface.style.backgroundImage = image ? `url("${image}")` : '';
    }

    function clearProjectPreview() {
      primaryPreview.classList.remove('has-project-image');
      primaryPreviewSurface.style.backgroundImage = '';
    }

    const rotatingProjects = projectButtons.filter(button => projectPreviewImages[button.dataset.project]);
    let rotatingProjectIndex = 0;
    let hoveredProject = null;
    let focusedProject = null;
    let previewRotationTimer;

    function showNextProjectPreview() {
      if (!rotatingProjects.length || hoveredProject || focusedProject) return;
      showProjectPreview(rotatingProjects[rotatingProjectIndex]);
      rotatingProjectIndex = (rotatingProjectIndex + 1) % rotatingProjects.length;
    }

    function startPreviewRotation() {
      clearInterval(previewRotationTimer);
      if (hoveredProject || focusedProject) return;
      primaryPreview.classList.remove('is-interactive');
      showNextProjectPreview();
      previewRotationTimer = setInterval(showNextProjectPreview, 800);
    }

    function showInteractivePreview() {
      clearInterval(previewRotationTimer);
      const activeProject = hoveredProject || focusedProject;
      primaryPreview.classList.toggle('is-interactive', Boolean(activeProject));
      if (activeProject) {
        showProjectPreview(activeProject);
      } else {
        startPreviewRotation();
      }
    }

    function selectProject(button) {
      projectButtons.forEach(item => {
        item.classList.toggle('is-selected', item === button);
        item.setAttribute('aria-pressed', item === button ? 'true' : 'false');
      });
      previews.forEach(preview => preview.dataset.project = button.dataset.project);
      if (button.dataset.href) {
        if (usesPointer || reduceMotion) {
          window.location.href = button.dataset.href;
        } else {
          setTimeout(() => {
            window.location.href = button.dataset.href;
          }, 260);
        }
      }
    }

    projectButtons.forEach(button => {
      button.setAttribute('aria-pressed', 'false');
      button.addEventListener('click', () => selectProject(button));
      button.addEventListener('pointerenter', () => {
        hoveredProject = button;
        showInteractivePreview();
      });
      button.addEventListener('focus', () => {
        focusedProject = button;
        showInteractivePreview();
      });
      button.addEventListener('pointerleave', () => {
        if (hoveredProject === button) hoveredProject = null;
        showInteractivePreview();
      });
      button.addEventListener('blur', () => {
        if (focusedProject === button) focusedProject = null;
        showInteractivePreview();
      });
    });

    startPreviewRotation();

    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const usesPointer = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
    const projectMenu = document.querySelector('.project-menu');
    const menuItems = projectButtons.map(button => ({
      button,
      row: button.closest('li'),
      stretch: 1.2,
      width: 1,
      weight: 500,
      leading: 1.108
    }));

    let previousY = window.scrollY;
    let wind = 0;
    let windTarget = 0;
    let cursorY = null;
    let interactionPaused = false;
    let resumeTimer;
    let animationFrame;

    function renderIndexMotion() {
      const viewportHeight = window.innerHeight;
      const zoneBottom = viewportHeight * .3;
      const zoneDepth = viewportHeight * .24;

      wind += (windTarget - wind) * .18;
      windTarget *= .85;
      document.documentElement.style.setProperty('--wind', `${wind * 4}px`);
      document.documentElement.style.setProperty('--wind-skew', `${wind * -1}deg`);

      menuItems.forEach(item => {
        if (interactionPaused) return;
        const top = item.row.getBoundingClientRect().top;
        const upperProgress = usesPointer
          ? cursorY === null ? 0 : Math.max(0, Math.min(1, (cursorY - top) / zoneDepth))
          : Math.max(0, Math.min(1, (zoneBottom - top) / zoneDepth));
        const targetStretch = 1.2 + upperProgress * (usesPointer ? .16 : .17);
        const targetWidth = 1 - upperProgress * (usesPointer ? .2 : .2);
        const targetWeight = 500 - upperProgress * (usesPointer ? 200 : 170);
        const targetLeading = 1.108 + upperProgress * (usesPointer ? .075 : .04);

        item.stretch += (targetStretch - item.stretch) * .18;
        item.width += (targetWidth - item.width) * .18;
        item.weight += (targetWeight - item.weight) * .18;
        item.leading += (targetLeading - item.leading) * .18;

        item.button.style.setProperty('--item-stretch', item.stretch.toFixed(4));
        item.button.style.setProperty('--item-width', item.width.toFixed(4));
        item.button.style.setProperty('--item-weight', Math.round(item.weight));
        item.row.style.setProperty('--item-leading', item.leading.toFixed(4));
      });

      animationFrame = requestAnimationFrame(renderIndexMotion);
    }

    if (!reduceMotion) {
      if (usesPointer) {
        projectMenu.addEventListener('pointerdown', () => {
          interactionPaused = true;
          wind = 0;
          windTarget = 0;
          document.documentElement.style.setProperty('--wind', '0px');
          document.documentElement.style.setProperty('--wind-skew', '0deg');
          clearTimeout(resumeTimer);
          resumeTimer = setTimeout(() => {
            interactionPaused = false;
          }, 260);
        });
        projectMenu.addEventListener('pointermove', event => {
          cursorY = event.clientY;
        }, { passive: true });
        projectMenu.addEventListener('pointerleave', () => {
          clearTimeout(resumeTimer);
          cursorY = null;
          interactionPaused = false;
        }, { passive: true });
      }

      window.addEventListener('scroll', () => {
        const delta = window.scrollY - previousY;
        previousY = window.scrollY;
        windTarget = Math.max(-1, Math.min(1, delta / 20));
      }, { passive: true });
      animationFrame = requestAnimationFrame(renderIndexMotion);
    }
  </script>
